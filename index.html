<!DOCTYPE html>
<html>
<head>
    <title>Student Database</title>
</head>
<body>

<h2>Student Records</h2>

<table border="1" id="table">
</table>

<script>
fetch("https://opensheet.elk.sh/1Ky4zXNJVvZd1QRqBlL6yZnGdOIsuzu47NdPEyZgTqPs/Sheet1")
.then(response => response.json())
.then(data => {

    let html = `
    <tr>
        <th>Name</th>
        <th>Branch</th>
        <th>CGPA</th>
    </tr>`;

    data.forEach(student => {
        html += `
        <tr>
            <td>${student.Name}</td>
            <td>${student.Branch}</td>
            <td>${student.CGPA}</td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
});
</script>

</body>
</html>
