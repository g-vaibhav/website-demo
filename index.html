<!DOCTYPE html>
<html>
<head>
    <title>Student Database</title>
</head>
<body>

<h2>Student Records</h2>

<table border="1" id="table">
</table>

<script>
fetch("https://docs.google.com/spreadsheets/d/1Ky4zXNJVvZd1QRqBlL6yZnGdOIsuzu47NdPEyZgTqPs/export?format=csv&gid=0")
.then(response => response.text())
.then(csv => {

    let rows = csv.trim().split("\n");

    let html = "";

    rows.forEach((row, index) => {

        let cols = row.split(",");

        html += "<tr>";

        cols.forEach(col => {
            if(index === 0)
                html += `<th>${col}</th>`;
            else
                html += `<td>${col}</td>`;
        });

        html += "</tr>";
    });

    document.getElementById("table").innerHTML = html;
});
</script>

</body>
</html>
